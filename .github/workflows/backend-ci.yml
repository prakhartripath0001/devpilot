name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: password
          POSTGRES_DB: devpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Tests and Build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/devpilot
          DB_USERNAME: devpilot
          DB_PASSWORD: password
          GEMINI_API_KEY: dummy-key-for-test
          OPENAI_API_KEY: dummy-key-for-test
          ENCRYPTOR_PASSWORD: dummy-password-12345
          ENCRYPTOR_SALT: 5c0744940b5c369b
          GITHUB_CLIENT_ID: dummy-client
          GITHUB_CLIENT_SECRET: dummy-secret
        run: ./mvnw clean verify
